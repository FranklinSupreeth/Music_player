<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melody Madness - Register</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <a href="/" class="logo">Melody Madness</a>
        </header>

        <!-- Registration Form -->
        <main class="form-container">
            <h1>Create Account</h1>
            <p>Sign up to start your musical journey</p>
            <form id="registerForm" novalidate>
                <!-- Full Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="name" name="name" placeholder="John Doe" required />
                    </div>
                    <small class="error-message" id="nameError"></small>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email" placeholder="your@email.com" required />
                    </div>
                    <small class="error-message" id="emailError"></small>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required />
                    </div>
                    <small class="error-message" id="passwordError"></small>
                </div>

                <!-- Terms and Conditions -->
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="acceptTerms" name="acceptTerms" />
                    <label for="acceptTerms">
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </label>
                    <small class="error-message" id="termsError"></small>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-button">Create Account</button>

                <!-- Divider -->
                <div class="divider">
                    <span>Or sign up with</span>
                </div>

                <!-- Social Buttons -->
                <div class="social-buttons">
                    <button type="button" class="social-button">Facebook</button>
                    <button type="button" class="social-button">Twitter</button>
                    <button type="button" class="social-button">LinkedIn</button>
                </div>

                <!-- Sign In Link -->
                <p class="signin-link">
                    Already have an account? <a class="lgin" href="/login.html">Sign in</a>
                </p>
            </form>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
